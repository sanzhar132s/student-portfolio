<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus — список задач</title><link rel="stylesheet" href="../shared.css"><main><a href="../../index.html">← Резюме</a><p class="eyebrow">01 / JAVASCRIPT PROJECT</p><h1>Focus · список задач</h1><p>Запиши дела, отмечай выполненные и следи за прогрессом. Данные сохраняются в этом браузере.</p><section class="panel"><form id="addForm"><label>Новая задача<input id="task" maxlength="180" required placeholder="Например, подготовиться к рубежке"></label><button>Добавить</button></form></section><div class="stats"><div class="stat"><span>Всего</span><strong id="total">0</strong></div><div class="stat"><span>Выполнено</span><strong id="completed">0</strong></div><div class="stat"><span>Осталось</span><strong id="remaining">0</strong></div></div><section class="panel"><div class="toolbar"><label>Показать<select id="filter"><option value="all">Все задачи</option><option value="active">Активные</option><option value="done">Выполненные</option></select></label><button class="secondary" id="clear">Удалить выполненные</button></div><ul id="list"></ul></section><p id="status" class="status" role="status"></p><footer>Учебный проект · HTML, CSS, JavaScript · без библиотек и регистрации</footer></main><script src="../storage.js"></script><script src="app.js"></script></html>
