<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget — учёт расходов</title><link rel="stylesheet" href="../shared.css"><main><a href="../../index.html">← Резюме</a><p class="eyebrow">02 / JAVASCRIPT PROJECT</p><h1>Budget · учёт расходов</h1><p>Добавляй покупки в тенге, смотри расходы по категориям и выгружай CSV для анализа.</p><section class="panel"><form id="form"><label>Покупка<input id="title" required maxlength="100" placeholder="Обед"></label><label>Сумма, ₸<input id="amount" type="number" min="0.01" max="100000000" step="0.01" required placeholder="1500"></label><label>Категория<select id="category"><option>Еда</option><option>Транспорт</option><option>Учёба</option><option>Другое</option></select></label><button>Добавить</button></form></section><div class="stats"><div class="stat"><span>Всего потрачено</span><strong id="total">0 ₸</strong></div><div class="stat"><span>Покупок</span><strong id="count">0</strong></div><div class="stat"><span>Средний расход</span><strong id="average">0 ₸</strong></div></div><section class="panel"><h2>По категориям</h2><div id="categories"></div></section><section class="panel"><div class="toolbar"><h2>История</h2><button id="export" class="secondary">Скачать CSV</button></div><ul id="list"></ul></section><p id="status" class="status" role="status"></p><footer>Данные сохраняются локально · CSV можно открыть в проекте «Report»</footer></main><script src="../storage.js"></script><script src="app.js"></script></html>
